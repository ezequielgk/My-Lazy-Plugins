id = "ashur-d/wallpaper-widget"
name = "Wallpaper Widget"
version = "1.0.1"
plugin_api = 15
author = "ashur-d"
license = "MIT"
icon = "image"
description = "Cinematic horizontal wallpaper switcher carousel and bar widget."
tags = ["bar", "panel", "shortcut", "wallpaper"]
dependencies = []

[[setting]]
key = "wallpaper_dir"
type = "folder"
label_key = "settings.wallpaper_dir.label"
description_key = "settings.wallpaper_dir.description"

[[setting]]
key = "apply_palette"
type = "bool"
label_key = "settings.apply_palette.label"
description_key = "settings.apply_palette.description"
default = true

[[setting]]
key = "default_palette_source"
type = "select"
label_key = "settings.default_palette_source.label"
description_key = "settings.default_palette_source.description"
default = "auto"
options = [
  { value = "auto", label_key = "settings.default_palette_source.auto" },
  { value = "wallpaper", label_key = "settings.default_palette_source.wallpaper" },
  { value = "none", label_key = "settings.default_palette_source.none" },
]

[[setting]]
key = "notify_on_change"
type = "bool"
label_key = "settings.notify_on_change.label"
description_key = "settings.notify_on_change.description"
default = true

[[setting]]
key = "close_on_apply"
type = "bool"
label_key = "settings.close_on_apply.label"
description_key = "settings.close_on_apply.description"
default = false

[[panel]]
id = "hub"
entry = "panel.luau"
width = 1160
height = 450
placement = "floating"
position = "center"
dismiss_on_outside_click = true
keyboard_focus = "exclusive"
capture_keys = ["Left", "Right", "Up", "Down", "Return", "Escape", "Space", "Delete", "Backspace", "p", "P"]

[[widget]]
id = "widget"
entry = "widget.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
