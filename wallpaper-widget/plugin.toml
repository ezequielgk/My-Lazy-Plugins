id = "ezequielgk/wallpaper-widget"
name = "Wallpaper Widget"
version = "1.2.0"
plugin_api = 15
author = "ezequielgk"
license = "MIT"
icon = "image"
description = "Cinematic horizontal wallpaper switcher carousel and bar widget."
tags = ["bar", "panel", "shortcut", "wallpaper"]
dependencies = []

[[setting]]
key = "wallpaper_dir"
type = "folder"
label_key = "settings.wallpaper_dir.label"
description_key = "settings.wallpaper_dir.description"

[[setting]]
key = "apply_palette"
type = "bool"
label_key = "settings.apply_palette.label"
description_key = "settings.apply_palette.description"
default = true

[[setting]]
key = "notify_on_change"
type = "bool"
label_key = "settings.notify_on_change.label"
description_key = "settings.notify_on_change.description"
default = true

[[setting]]
key = "close_on_apply"
type = "bool"
label_key = "settings.close_on_apply.label"
description_key = "settings.close_on_apply.description"
default = false

# --- AÑADIR NUEVA COLECCIÓN ---
[[setting]]
key = "add_folder_path"
type = "folder"
label_key = "settings.add_folder_path.label"
description_key = "settings.add_folder_path.description"

[[setting]]
key = "add_palette_type"
type = "select"
label_key = "settings.add_palette_type.label"
description_key = "settings.add_palette_type.description"
default = "builtin"
options = [
  { value = "builtin", label_key = "settings.type_builtin" },
  { value = "wallpaper", label_key = "settings.type_wallpaper" },
  { value = "community", label_key = "settings.type_community" },
  { value = "custom", label_key = "settings.type_custom" },
]

[[setting]]
key = "add_palette_name"
type = "string"
label_key = "settings.add_palette_name.label"
description_key = "settings.add_palette_name.description"
default = ""

[[panel]]
id = "hub"
entry = "panel.luau"
width = 1160
height = 430
placement = "floating"
position = "center"
dismiss_on_outside_click = true
keyboard_focus = "exclusive"
capture_keys = ["Left", "Right", "Up", "Down", "Return", "Escape", "Space", "Delete", "Backspace", "f", "F"]

[[widget]]
id = "widget"
entry = "widget.luau"

[[shortcut]]
id = "toggle"
entry = "shortcut.luau"
