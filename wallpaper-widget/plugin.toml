[[setting]]
key = "slot_1_type"
type = "select"
label_key = "settings.slot_1_type.label"
description_key = "settings.slot_1_type.description"
default = "builtin"
options = [
  { value = "builtin", label_key = "settings.type_builtin" },
  { value = "wallpaper", label_key = "settings.type_wallpaper" },
  { value = "community", label_key = "settings.type_community" },
